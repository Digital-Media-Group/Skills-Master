schemaVersion: 1
id: dokploy-swarm-stack-deployment
version: 0.2.0
status: experimental
category: devops-cloud
name:
  es: Despliegue Dokploy en modo Stack (Swarm) multi-nodo
  en: Dokploy Swarm Stack Deployment
summary:
  es: Preparar y operar un stack Dokploy/Swarm escalable desde el primer nodo, con imagen de registry, migraciones idempotentes en entrypoint y datos persistentes fijados al manager.
  en: Prepare and operate a Dokploy/Swarm stack that is scalable from the first node, with registry images, idempotent entrypoint migrations, and manager-pinned persistent data.
tags:
  - dokploy
  - docker-swarm
  - stack-deployment
  - ghcr
  - multi-node
  - migrations
  - registry
maintainers:
  - community
license: Apache-2.0
locales:
  - es
  - en
compatibility:
  - universal
  - claude-code
  - openai-codex
capabilities:
  - files
  - shell
  - cloud
  - credentials
riskLevel: high
inputs:
  es:
    - Repositorio Git, rama de despliegue protegida y workflow que publique una imagen versionada en un registry.
    - "Acceso al panel Dokploy, Compose Type Stack, dominio, variables de entorno y credenciales de registry de solo lectura."
    - "Decisiones de persistencia: base de datos, uploads, object storage externo, backups y nodos manager/worker."
  en:
    - Git repository, protected deployment branch, and workflow that publishes a versioned image to a registry.
    - "Dokploy panel access, Stack Compose Type, domain, environment variables, and read-only registry credentials."
    - "Persistence decisions: database, uploads, external object storage, backups, and manager/worker nodes."
outputs:
  es:
    - Stack Dokploy/Swarm operativo desde un solo nodo y preparado para escalar web a múltiples nodos.
    - Imagen privada publicada en registry, migraciones idempotentes dentro del entrypoint, healthchecks, rollback por SHA y documentación de operación.
  en:
    - Dokploy/Swarm stack operational on one node and ready to scale web replicas across multiple nodes.
    - Private registry image, idempotent entrypoint migrations, healthchecks, SHA rollback, and operations documentation.
dependencies:
  - containerize-web-application
lastReviewed: 2026-09-22
