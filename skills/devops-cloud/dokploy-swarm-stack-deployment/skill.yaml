schemaVersion: 1
id: dokploy-swarm-stack-deployment
version: 0.3.0
status: experimental
category: devops-cloud
name:
  es: Despliegue Dokploy en modo Stack (Swarm) multi-nodo
  en: Dokploy Swarm Stack Deployment
summary:
  es: Preparar, diagnosticar y operar stacks Dokploy/Swarm con imágenes SHA, GHCR privado, caché de fuente, Traefik, Cloudflare, persistencia y smoke tests externos.
  en: Prepare, diagnose, and operate Dokploy/Swarm stacks with SHA images, private GHCR, source-cache handling, Traefik, Cloudflare, persistence, and external smoke tests.
tags:
  - dokploy
  - docker-swarm
  - stack-deployment
  - ghcr
  - private-registry
  - traefik
  - cloudflare
  - multi-node
  - migrations
  - rollback
  - smoke-tests
maintainers:
  - community
license: Apache-2.0
locales:
  - es
  - en
compatibility:
  - universal
  - claude-code
  - openai-codex
capabilities:
  - files
  - shell
  - cloud
  - credentials
riskLevel: high
inputs:
  es:
    - Repositorio Git, rama protegida, workflow CI válido y ruta exacta del Compose.
    - "Acceso al panel/API Dokploy, Compose Type Stack, dominio, variables protegidas y registry privado con read:packages."
    - "Acceso SSH opcional a un manager mediante clave local nueva, nunca pegada en chat."
    - "Decisiones de persistencia: base de datos, uploads, object storage externo, backups, nodos y estrategia de rollback."
  en:
    - Git repository, protected branch, valid CI workflow, and exact Compose path.
    - "Dokploy panel/API access, Stack Compose Type, domain, protected variables, and private registry with read:packages."
    - "Optional SSH access to a manager using a new local key, never pasted in chat."
    - "Persistence decisions: database, uploads, external object storage, backups, nodes, and rollback strategy."
outputs:
  es:
    - Stack Dokploy/Swarm operativo desde un solo nodo y preparado para escalar web a múltiples nodos.
    - CI que valida scripts existentes y publica imágenes SHA antes del deploy.
    - Registry privado autenticado, recuperación sin borrar volúmenes y diagnóstico de caché Dokploy.
    - Migraciones idempotentes, healthchecks, rutas Traefik/Cloudflare verificadas, smoke tests externos y rollback documentado.
  en:
    - Dokploy/Swarm stack operational on one node and ready to scale web across multiple nodes.
    - CI that validates existing scripts and publishes SHA images before deployment.
    - Authenticated private registry, volume-preserving recovery, and Dokploy source-cache diagnosis.
    - Idempotent migrations, health checks, verified Traefik/Cloudflare routes, external smoke tests, and documented rollback.
dependencies:
  - containerize-web-application
lastReviewed: 2026-09-22
