schemaVersion: 1
id: dokploy-swarm-stack-deployment
version: 0.6.1
status: experimental
category: devops-cloud
name:
  es: Despliegue Dokploy en modo Stack (Swarm) multi-entorno
  en: Dokploy Swarm Stack Deployment
summary:
  es: Preparar, promover y diagnosticar stacks Dokploy/Swarm con gates de backup verificable, builds API-only, mantenimiento independiente y bindings site/app.
  en: Prepare, promote, and diagnose Dokploy/Swarm stacks with verifiable backup gates, API-only builds, independent maintenance, and site/app bindings.
tags:
  - dokploy
  - docker-swarm
  - stack-deployment
  - ghcr
  - private-registry
  - api-only-build
  - native-volume-backup
  - single-node
  - promotion
  - site-app-domains
  - traefik
  - rollback
  - smoke-tests
maintainers:
  - community
license: Apache-2.0
locales:
  - es
  - en
compatibility:
  - universal
  - claude-code
  - openai-codex
capabilities:
  - files
  - shell
  - cloud
  - credentials
riskLevel: high
inputs:
  es:
    - Repositorio Git o snapshot ZIP saneado, Compose Stack y workflow compatibles.
    - "Acceso a la API/panel Dokploy, stacks aislados, dominios site/app y variables protegidas."
    - "Registry privado opcional; permisos de publicación y lectura deben comprobarse por separado."
    - "Decisiones de persistencia, backup/restore, seeds, smoke tests, promoción y aprobación de Production."
  en:
    - Git repository or sanitized ZIP snapshot, compatible Stack Compose, and workflow.
    - "Dokploy API/panel access, isolated stacks, site/app domains, and protected variables."
    - "Optional private registry; push and pull permissions must be verified separately."
    - "Persistence, backup/restore, seed, smoke-test, promotion, and Production approval decisions."
outputs:
  es:
    - Stacks Dokploy/Swarm aislados y promovibles Development -> Preview -> Production.
    - Builds reproducibles por registry digest o snapshot API-only explícitamente acotado.
    - Backup nativo de volumen/backup remoto con evidencia de finalización o restore rehearsal.
    - Dos superficies site/app por entorno, enlazadas al servicio completo Swarm.
    - Smoke tests, diagnóstico de tareas/logs y rollback documentado.
  en:
    - Isolated Dokploy/Swarm stacks promotable from Development -> Preview -> Production.
    - Reproducible registry-digest builds or explicitly scoped API-only snapshot builds.
    - Native volume or remote backups with completion evidence or restore rehearsal.
    - Separate site/app surfaces per environment, bound to the full Swarm service.
    - Smoke tests, task/log diagnosis, and documented rollback.
dependencies:
  - containerize-web-application
lastReviewed: 2026-09-23
