lastReviewed: 2026-10-24

# Operational invariants
# - Use composeType: docker-compose. Never silently convert this workflow to Stack/Swarm or Nixpacks.
# - Set appName explicitly in compose.create, for example firma-documentos and firma-documentos-master.
# - Set randomize: false when supported. Dokploy versions may still append a suffix; verify the returned appName and record it.
# - compose.update is not a reliable appName rename operation. If the technical name is wrong, create a new Compose with the desired appName, validate it, move the domain, then delete the old Compose with deleteVolumes: false unless volume deletion is explicitly approved.
# - Keep project and Compose display names neutral: Firma de Documentos. Branches/environments express master versus production.
# - Preserve PostgreSQL volumes by default. Never pass deleteVolumes: true or freshVolumes: true without explicit approval.
# - Save the complete environment before deployment. Verify POSTGRES_PASSWORD is available to Compose interpolation and matches DATABASE_URL.
# - Normal flow: master -> validation -> PR -> explicit approval -> production.
# - Verify db, web, worker, DNS, TLS, and repeated public /api/health HTTP 200 before declaring success.
# - If Dokploy API/TLS is unstable, stop destructive actions and wait for a stable read-back.
